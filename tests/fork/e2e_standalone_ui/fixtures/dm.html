<script>
(function () {
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (k) { e.appendChild(typeof k === 'string' ? document.createTextNode(k) : k); });
    return e;
  }
  function reactji(name) {
    var label = name.replace(/_/g, ' ') + ' emoji';
    return el('button', {'data-qa': 'reactji', 'aria-label': '1 reaction, react with ' + label},
              [el('img', {'aria-label': label, 'data-qa': 'emoji'})]);
  }
  window.fx = {
    nextTs: 1700001000,
    // o: {ts, name, bot, botId, text, reactions: [names]}
    item: function (o, inThread) {
      var content = el('div', {'data-qa': 'message_content'});
      if (o.name) {
        content.appendChild(el('span', {'data-qa': 'message_sender'},
                               [el('button', {'data-qa': 'message_sender_name'}, [o.name])]));
      }
      if (o.bot) { content.appendChild(el('span', {'data-qa': 'message_sender_app_badge'}, ['APP'])); }
      content.appendChild(el('a', {'data-ts': o.ts, 'href': '#'}));
      content.appendChild(el('div', {'data-qa': 'message-text'}, [o.text || '']));
      var bar = el('div', {'role': 'group', 'data-qa': 'reaction_bar'});
      (o.reactions || []).forEach(function (r) { bar.appendChild(reactji(r)); });
      content.appendChild(bar);
      var kids = [];
      if (o.botId) { kids.push(el('a', {'href': '/team/' + o.botId})); }
      kids.push(content);
      var attrs = {'role': 'listitem', 'data-qa': 'virtual-list-item', 'data-item-key': o.ts};
      if (!inThread) { attrs.id = 'message-list_' + o.ts; }
      return el('div', attrs, [el('div', {'data-qa': 'message_container'}, kids)]);
    },
    add: function (o, inThread) {
      document.getElementById(inThread ? 'thread-list' : 'list').appendChild(this.item(o, inThread));
    },
    react: function (ts, names) {
      var item = document.querySelector('#list [data-item-key="' + ts + '"]');
      var bar = item.querySelector('[data-qa="reaction_bar"]');
      if (!bar) {
        bar = el('div', {'role': 'group', 'data-qa': 'reaction_bar'});
        item.querySelector('[data-qa="message_content"]').appendChild(bar);
      }
      bar.innerHTML = '';
      names.forEach(function (n) { bar.appendChild(reactji(n)); });
    }
  };
  // Enter in a composer "sends": my message appears shortly after with a new ts.
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (e.key !== 'Enter' || !t.matches || !t.matches('[data-qa="texty_input"]')) { return; }
    e.preventDefault();
    var text = t.innerText.trim();
    if (!text) { return; }
    t.innerHTML = '';
    var ts = String(window.fx.nextTs++) + '.000900';
    var inThread = !!t.closest('[data-qa="threads_flexpane"]');
    setTimeout(function () { window.fx.add({ts: ts, name: 'Test User', text: text}, inThread); }, 50);
  });
})();
</script>
