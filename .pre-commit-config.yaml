# Checks that run on your machine before each commit. Set up once with:
#   uv run pre-commit install
# Run on everything with:  uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: end-of-file-fixer
        files: \.(md|yml|yaml|json|toml)$
      - id: trailing-whitespace
        files: \.(md|yml|yaml|toml)$

  # Keep the same version as the dev group in pyproject.toml and .github/workflows/ci.yml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check

  # Stops a commit that contains an API key, a Slack token or an AWS secret.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
