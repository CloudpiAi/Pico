# Project basic information configuration, required.
[project]
name = "pico-agent"
version = "0.2.0"
description = "Pico FinOps Agent: answers AWS cost questions in Slack from your own FOCUS billing export (fork of Datus-agent 0.4.1)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE*"]
authors = [
    { name = "PurpleData Inc." }
]
maintainers = [
    { name = "PurpleData Inc." }
]
keywords = ["finops", "cloud-cost", "aws", "focus", "billing", "slack", "ai", "agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business :: Financial",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "datus-db-core>=0.1.7",
    "datus-storage-base>=0.1.5,<0.2.0",
    "python-dotenv==1.2.2",
    "pandas==2.3.3",
    "sqlalchemy==2.0.55",
    "sqlglot>=26.12.0,<31",
    "pyyaml==6.0.3",
    "packaging>=21.0",
    "structlog>=23.1.0",
    # Floor: openai-agents 0.14.x requires openai>=2.26. Cap below 2.45.0: openai
    # 2.45.0 made ``InputTokensDetails.cache_write_tokens`` a required field and
    # ``pico/models/claude_model.py`` still constructs ``InputTokensDetails``
    # without it. Lift the cap together with that code.
    "openai>=2.26.0,<2.45.0",
    "httpx[socks]>=0.28.1,<1",
    "tantivy>=0.22.2",
    "aiohttp>=3.11.16",
    # Pico's Slack gateway (pico/gateway); Socket Mode uses aiohttp above.
    "slack-sdk==3.46.0",
    # Windows has no time zone database of its own; the digest's late alert needs one.
    "tzdata>=2025.2",
    "xlsxwriter>=3.2.2",
    # Spreadsheet ingestion (``load_file_as_table``). DuckDB's excel extension
    # reads sheet *contents* but cannot enumerate sheet names or report the used
    # range, both of which are needed to build a correct VIEW; openpyxl supplies
    # them. xlrd covers legacy .xls, which DuckDB does not support at all.
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "openai-agents[litellm]==0.14.8",
    "openinference-instrumentation-openai-agents==1.6.2",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    # Floor: litellm before 1.95.0 has Critical and known-exploited vulnerabilities, and 1.109 is the first that allows
    # filelock 4 (see [tool.uv] constraint-dependencies). 1.82.7, 1.82.8 and 1.107.0 were malicious releases
    # (docs.litellm.ai incident reports) and are excluded. It needs httpx>=0.28 and pyyaml>=6.0.3.
    "litellm>=1.109.1,<2,!=1.107.0",
    "pydantic>=2.11.7,<3.0",
    "lancedb==0.34.0",
    # This library is required by lancedb
    "pyarrow>=23.0.1,<24",
    "rich==15.0.0",
    "prompt_toolkit>=3.0.51",
    "pygments>=2.18.0",
    "textual[syntax]==5.1.1",
    "anthropic==0.51.0",
    "duckdb-engine>=0.17.0",
    "duckdb==1.5.2",
    # MCP (Model Context Protocol) support
    "mcp>=1.11.0",
    "anyio>=4.9.0",
    "json-repair>=0.47.6",
    "fastapi>=0.104.0,<1.0",
    "uvicorn>=0.24.0",
    "pyperclip==1.9.0",
    "wcmatch>=10.0",
    "fastembed==0.9.1",
    # Optional: install torch manually to enable reranker models.
    "charset-normalizer>=3.4.2",
    "defusedxml>=0.7.1",
    # Platform documentation tools
    "PyGithub>=2.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "markdown-it-py>=3.0.0",
    "tabulate>=0.9.0",
    "datus-semantic-core>=0.2.4",
    # BI platform adapters (core models & interfaces)
    "datus-bi-core>=0.1.2",
    # Workflow scheduler adapters (core framework)
    "datus-scheduler-core>=0.1.1",
    # Plugin manifest: config-schema validation and system-prompt templates
    "jsonschema>=4.17,<5",
    "jinja2>=3.1,<4",
    "redis>=5.0,<7",
]

[project.optional-dependencies]
# The Pico FinOps Agent (pico_finops_agent/scheduler.py, plugins/focus): uv sync --extra pico-finops-agent
pico-finops-agent = [
    "apscheduler>=3.10,<4",
    "boto3",
]

[project.urls]
Homepage = "https://github.com/CloudpiAi/Pico"
Documentation = "https://github.com/CloudpiAi/Pico/blob/main/docs/CUSTOMER-SETUP-GUIDE.md"
Repository = "https://github.com/CloudpiAi/Pico"
"Bug Tracker" = "https://github.com/CloudpiAi/Pico/issues"
Changelog = "https://github.com/CloudpiAi/Pico/blob/main/CHANGELOG.md"
Security = "https://github.com/CloudpiAi/Pico/security/policy"

[project.scripts]
pico-agent = "pico.entrypoints:agent_main"
pico-cli = "pico.entrypoints:cli_main"
pico = "pico.entrypoints:cli_main"
pico-api = "pico.entrypoints:api_main"
pico-mcp = "pico.entrypoints:mcp_main"
pico-gateway = "pico.entrypoints:gateway_main"

[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pico*"]
# The wheel is the Pico framework only: the agent (pico_finops_agent, which "pico*" would match) runs from
# the source tree, and plugins/focus is installed as its own package.
exclude = ["benchmark*", "docs*", "plugins.focus*", "plugins.schedule*", "pico_finops_agent*"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.json", "*.md", "*.txt", "*.j2"]
"pico" = [
    "*.yml", "*.yaml", "*.json", "*.md", "*.txt",
    "sample_data/*.duckdb",
    "sample_data/california_schools/*.csv",
    "sample_data/california_schools/*.sqlite",
    "sample_data/california_schools/reference_sql/*.sql",
    "sample_data/california_schools/reference_template/*",
    "sample_data/superset/*",
]
"pico.cli.web" = ["templates/*.html"]
"pico.agent.node.visual_artifact" = ["templates/*.html"]
"pico.prompts" = ["*.txt", "*.md", "*.j2"]
"pico.prompts.prompt_templates" = ["*.j2"]

# Ruff: replaces black + isort + flake8
# Security floors for transitive dependencies (not direct dependencies of Pico): each one is the first release
# without a known vulnerability that the image scan (grype) or pip-audit reports. Raise, never lower.
[tool.uv]
constraint-dependencies = [
    "filelock>=4.2.1",
    "pygments>=2.20.0",
    "soupsieve>=4.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["mcp/"]

[tool.ruff.format]
# Compatible with black defaults

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "B", # flake8-bugbear
    "I", # isort
    "C90", # mccabe complexity
    "T20", # flake8-print (enforce "no print()" guardrail)
]
ignore = [
    "E203", # whitespace before ':'
    "E266", # too many leading '#' for block comment
    "E501", # line too long (handled by formatter)
    # TODO: enable these rules incrementally in follow-up PRs
    "C901", # function too complex (218 existing violations)
    "B904", # raise without from inside except (22 existing violations)
    "B905", # zip without explicit strict (21 existing violations)
    "B027", # empty method without abstract decorator
    "B007", # unused loop control variable
    "B019", # cached instance method
    "B024", # abstract base class without abstract method
    "T201", # print found (63 existing violations, clean up incrementally)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["pico", "plugins", "pico_finops_agent", "pico_plugin_focus_data", "pico_plugin_schedule"]
known-third-party = ["mcp"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
# markers are defined in pytest.ini to avoid duplication

[dependency-groups]
# uv sync --dev
dev = [
    "pytest==8.0.2",
    "pytest-asyncio>=0.23.8",
    "jsonschema>=4.25.1,<5",
    # Keep the same version in .github/workflows/ci.yml and .pre-commit-config.yaml
    "ruff==0.15.6",
    "mypy==1.8.0",
    "tqdm>=4.27.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.7.0",
    "pytest-rerunfailures>=14.0",
    "pre-commit>=4.2.0",
    "setuptools>=80.9.0",
    "pip>=25.1.1",
    "build>=1.2.0",
    "twine>=6.1.0",
    "langsmith>=0.7.0",
    "langsmith-fetch>=0.1.0",
    "langfuse>=3.0.0",
    "pytest-cov>=7.0.0",
    "chardet>=3.0.2,<6",
    "diff-cover>=10.2.0",
    # Writes legacy .xls fixtures. Only a *writer* is needed for tests; the
    # runtime reads .xls through xlrd, which is a real dependency.
    "xlwt>=1.3.0",
]
ci = [
    "datus-storage-postgresql>=0.1.5",
    # A floor, not an exact pin: every adapter release since 0.1.7 pins its
    # dosi-engine release-for-release (0.1.9 → dosi-engine==0.1.9), so whatever
    # the resolver picks is an installable pair; the marker keeps platforms
    # without a dosi-engine wheel resolvable (wheels exist for manylinux
    # x86_64/aarch64 and macOS arm64). 0.1.9 is the floor because it adds
    # DosiAdapter.lineage_graph (metric lineage DAG), the authoring contract
    # and parameterized query_metrics that #1392 probes for. Pico-backend pins
    # exactly for its image; being a dependency group, this line is never
    # inherited by the backend's own resolution.
    "datus-semantic-dosi>=0.1.9 ; (platform_machine == 'x86_64' and sys_platform == 'linux') or (platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'arm64' and sys_platform == 'darwin')",
]

[tool.coverage.run]
source = ["pico", "plugins", "pico_finops_agent", "plugins/focus/pico_plugin_focus_data", "plugins/schedule/pico_plugin_schedule"]
omit = [
    "pico/prompts/prompt_templates/*",
    "pico/cli/screen/*",
    "pico/cli/sub_agent_wizard.py",
    "pico/cli/profile_picker_app.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "except ImportError",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2
