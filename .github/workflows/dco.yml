name: Pico / DCO

# Every commit in a pull request must carry a Developer Certificate of Origin sign-off
# ("Signed-off-by: Name <email>", added by `git commit -s`). See CONTRIBUTING.md.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $(git show -s --format='%h %s' "$c") has no 'Signed-off-by:' line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add a sign-off to each commit: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
