name: Pico / Build Docker Image

# Builds the image exactly as a customer does (`docker compose build` uses the same Dockerfile) and checks it.
# On a release tag vX.Y.Z (on main), the checked image is published to the GitHub Container Registry:
#   ghcr.io/cloudpiai/pico-finops-agent:X.Y.Z and :latest   (no secret: the built-in GITHUB_TOKEN)
# Pull requests and main only build and check; they never publish.
on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    # (GitHub doesn't apply path filters to tag pushes: a release tag always runs.)
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.github/**'
      - '.github/actions/build-image/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.github/**'
      - '.github/actions/build-image/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      disableCaching:
        description: 'Disable Caching'
        required: false
        type: boolean
        default: false

# Runs on pull requests from forks too: read-only token, no secrets. Only the publish job gets packages: write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: "pico-finops-agent:ci"
  REGISTRY_IMAGE: "ghcr.io/cloudpiai/pico-finops-agent"

jobs:
  build:
    name: "Build Docker Image (AMD64)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Image
        uses: ./.github/actions/build-image
        with:
          image: ${{ env.IMAGE }}
          disableCaching: ${{ inputs.disableCaching == true && 'true' || 'false' }}

      # The same numbered checks as the maintainers' image check (see the script's header).
      - name: Check the image
        run: sh .github/actions/build-image/check-image.sh "$IMAGE" .

      # Known vulnerabilities in the image (grype). Pull requests and main only report them; a release tag is not
      # published while a Critical vulnerability with an available fix is in the image.
      - name: Scan the image for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}
          only-fixed: true
          severity-cutoff: critical
          fail-build: ${{ startsWith(github.ref, 'refs/tags/v') }}
          output-format: table

      # Release tags only: hand the exact image that passed the checks to the publish job.
      - name: Save the checked image
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker save "$IMAGE" | gzip -1 > image.tar.gz

      - name: Store the checked image as an artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pico-finops-agent-image-amd64
          path: image.tar.gz
          retention-days: 1

  publish:
    name: "Publish to GitHub Container Registry"
    # Release tags in this repository only (never from a fork, never from a PR), after every check passed.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'CloudpiAi/Pico'
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Signed build-provenance and SBOM attestations (Sigstore), stored with the image and on GitHub.
      id-token: write
      attestations: write
    steps:
      - name: Checkout (full history, to check the tag is on main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} is not on main; release tags are made on main only."; exit 1; }

      - name: Load the checked image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pico-finops-agent-image-amd64

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push vX.Y.Z (and latest, when it is the newest release)
        id: push
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gunzip -c image.tar.gz | docker load
          V="${VERSION#v}"
          docker tag "$IMAGE" "$REGISTRY_IMAGE:$V"
          docker push "$REGISTRY_IMAGE:$V" | tee push.log
          # The registry's digest of what was pushed: the attestations below are made for exactly this image.
          DIGEST=$(grep -oE 'digest: sha256:[0-9a-f]{64}' push.log | tail -1 | cut -d' ' -f2)
          [ -n "$DIGEST" ] || { echo "::error::no digest in the docker push output"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published $REGISTRY_IMAGE:$V ($DIGEST)" | tee -a "$GITHUB_STEP_SUMMARY"
          # :latest only moves forward: a patch tag for an older line (v0.1.5 after v0.2.0) must not roll it back.
          NEWEST=$(git tag -l --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ "$NEWEST" = "$VERSION" ]; then
            docker tag "$IMAGE" "$REGISTRY_IMAGE:latest"
            docker push "$REGISTRY_IMAGE:latest"
            echo "Moved $REGISTRY_IMAGE:latest to $V" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Not moving :latest: the newest release is $NEWEST" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Make the SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: pico-finops-agent.spdx.json
          artifact-name: pico-finops-agent-${{ github.ref_name }}.spdx.json
          # This job can't write to the Release (contents: read); the SBOM is a workflow artifact and an attestation.
          upload-release-assets: false

      # Anyone can check an image with: gh attestation verify oci://ghcr.io/cloudpiai/pico-finops-agent:<version> -R CloudpiAi/Pico
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: pico-finops-agent.spdx.json
          push-to-registry: true
          create-storage-record: false
