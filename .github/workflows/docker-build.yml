name: Pico / Build Docker Image

# Builds the image exactly as a customer does (`docker compose build` uses the same Dockerfile) and checks it.
# Nothing is pushed to any registry: customers build the image themselves.
on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.github/**'
      - '.github/actions/build-image/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.github/**'
      - '.github/actions/build-image/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      disableCaching:
        description: 'Disable Caching'
        required: false
        type: boolean
        default: false

# Runs on pull requests from forks too: read-only token, no secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: "pico-finops-agent:ci"

jobs:
  build:
    name: "Build Docker Image (AMD64)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Image
        uses: ./.github/actions/build-image
        with:
          image: ${{ env.IMAGE }}
          disableCaching: ${{ inputs.disableCaching == true && 'true' || 'false' }}

      # The same numbered checks as the maintainers' image check (see the script's header).
      - name: Check the image
        run: sh .github/actions/build-image/check-image.sh "$IMAGE" .
