# Weekly update pull requests for the locked Python dependencies, the GitHub Actions (pinned by commit SHA) and the
# Docker base images. Security updates are opened as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels:
      - "area: dependencies"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/build-image
    schedule:
      interval: weekly
    labels:
      - "area: dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - "area: dependencies"
