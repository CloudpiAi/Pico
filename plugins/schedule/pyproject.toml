[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-plugin-schedule"
version = "0.1.0"
description = "Scheduled Slack tasks for a Pico agent: reminders, reports, saved queries and recurring questions"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "PurpleData Inc." }]
dependencies = ["apscheduler>=3.10,<4"]  # no DuckDB: only a data source (e.g. FocusSource) needs it

[project.urls]
Homepage = "https://github.com/CloudpiAi/Pico"
Repository = "https://github.com/CloudpiAi/Pico"
"Bug Tracker" = "https://github.com/CloudpiAi/Pico/issues"

[project.entry-points."pico.plugins"]
schedule = "pico_plugin_schedule"

[tool.setuptools.packages.find]
include = ["pico_plugin_schedule*"]

[tool.setuptools.package-data]
pico_plugin_schedule = ["pico-plugin.yml", "skills/*/SKILL.md"]
